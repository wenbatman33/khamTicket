<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><title>驗證碼輸入法防呆</title></head><body>
<input type="hidden" id="QUANTITY_LIMIT" value="4" />
<input type="hidden" ID="T1" KEY="TYPE_ID" Value="T1" />
<input class="numbox" type="number" id="AMOUNT" KEY='T1' value="0" />
<input name="CHK" type="text" maxlength="4" id="CHK" />
<script>
 window.__result = {};
 const store = { enabled:false, autoSubmitCaptcha:false, count:2, presaleCode:'' };
 window.chrome = { storage:{ sync:{ get:(d)=>Promise.resolve(Object.assign({},d,store)) },
   local:{ get:(d)=>Promise.resolve(d), set:()=>Promise.resolve() }, onChanged:{ addListener(){} } },
   runtime:{ onMessage:{ addListener(){} }, sendMessage(){} } };
 window.addShoppingCart = () => { window.__result.submitted = true; };
 window.fetch = () => Promise.reject(new Error('offline test'));
</script>
<script src="../content.js"></script>
<div id="RESULT">running…</div>
<script>
const chk = document.getElementById('CHK');
const type = (v) => { chk.value = v; chk.dispatchEvent(new Event('input', { bubbles: true })); };
setTimeout(() => { type('ＡＢ１２'); window.__result.full = chk.value; }, 1000);   // 忘了切輸入法：全形
setTimeout(() => { type('你好'); window.__result.cjk = chk.value; }, 1300);       // 直接打出中文
setTimeout(() => { type('aB3x'); window.__result.ok = chk.value; }, 1600);        // 正常英數
setTimeout(() => {
  const r = window.__result;
  document.getElementById('RESULT').textContent =
    'FULLWIDTH_TO_HALF=' + (r.full === 'AB12' ? 'PASS' : 'FAIL(' + r.full + ')') +
    ' | CJK_REMOVED=' + (r.cjk === '' ? 'PASS' : 'FAIL(' + r.cjk + ')') +
    ' | NORMAL_UNTOUCHED=' + (r.ok === 'aB3x' ? 'PASS' : 'FAIL(' + r.ok + ')') +
    ' | INPUTMODE=' + (chk.getAttribute('inputmode') === 'latin' ? 'PASS' : 'FAIL');
}, 2400);
</script>
</body></html>
