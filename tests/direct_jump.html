<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><title>直達測試</title></head><body>
<!-- 模擬：開賣前停在節目頁（不是票區頁），時間一到要直接跳票區頁 -->
<h1>節目頁</h1><button id="GO_BUY2" onclick="window.__result.goBuy=true">立即購票</button>
<script>
 window.__result = {};
 const store = { enabled:true, startAt:'', refreshMs:300, presaleCode:'', priceTargets:'', targets:'',
                 crossPrice:false, count:2,
                 directUrls:'P1FDECMD,P1EMCIC6\nP1FDSO0X,P1EMCIC6\nP1FDWY6H,P1EMCIC6' };
 window.chrome = {
   storage:{ sync:{ get:(d)=>Promise.resolve(Object.assign({},d,store)) },
             local:{ get:(d)=>Promise.resolve(d), set:()=>Promise.resolve() },
             onChanged:{ addListener(){} } },
   runtime:{ onMessage:{ addListener(){} }, sendMessage(){} },
 };
 window.fetch = () => Promise.reject(new Error('offline test'));
</script>
<script src="../content.js"></script>
<div id="RESULT">running…</div>
<script>setTimeout(()=>{document.getElementById('RESULT').textContent='NO_JUMP';},2500);</script>
</body></html>
