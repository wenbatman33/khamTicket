<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><title>票區頁測試</title>
<style>
 body{font-family:"PingFang TC",sans-serif}
 table{border-collapse:collapse;width:600px}td{padding:8px;border-bottom:1px dotted #ccc}
 .Soldout td{color:#bbb;text-decoration:line-through}
</style></head><body>
<!-- 跟真實票區頁同構：#salesTable + tr.status_tr，第 4 欄是空位 -->
<input type="hidden" id="PERFORMANCE_ID" value="P100">
<div id="AREA_DIV">
  <span class="fix-checkbox"><input type="checkbox" id="HIDE"> 僅顯示未完售區</span>
  <table id="salesTable">
    <tr class="status_tr Soldout" id="1001" rel="a24"><td>■</td><td>平面A4區8880元</td><td>8,880</td><td>已售完</td></tr>
    <tr class="status_tr Soldout" id="1002" rel="a24"><td>■</td><td>平面A10區8880元</td><td>8,880</td><td>已售完</td></tr>
    <tr class="status_tr" id="1003" rel="a25"><td>■</td><td>平面B5區8880元</td><td>8,880</td><td>12</td></tr>
    <tr class="status_tr" id="1004" rel="a25"><td>■</td><td>平面B9區8880元</td><td>8,880</td><td>37</td></tr>
  </table>
</div>
<div id="action"></div>
<!-- 真實票區頁的座位圖：GROUP_ID 藏在 area 的 Send() 裡，工具靠它組出購票網址 -->
<img id="IMG_MAP" usemap="#seat" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10">
<map name="seat">
  <area shape="rect" coords="0,0,1,1" href="javascript:Send('0201','P100','1001','24')">
  <area shape="rect" coords="0,0,1,1" href="javascript:Send('0201','P100','1003','25')">
  <area shape="rect" coords="0,0,1,1" href="javascript:Send('0201','P100','1004','25')">
</map>
<script>
 window.__result = {};
 const store = { presaleCode:'', enabled:true, autoSubmitPresale:true, startAt:'', refreshMs:300,
                 count:2, pickMostSeats:true, hideSoldOut:true, targets:'', priceTargets:'', crossPrice:false };
 window.chrome = {
   storage:{ sync:{ get:(d)=>Promise.resolve(Object.assign({},d,store)) },
             local:{ get:(d)=>Promise.resolve(d), set:()=>Promise.resolve() },
             onChanged:{ addListener(){} } },
   runtime:{ onMessage:{ addListener(){} }, sendMessage(){} },
 };
 // 不讓它真的導航，改記下來（真實環境就是 location.href = 這個網址）
 window.fetch = () => Promise.reject(new Error('offline test'));
</script>
<script src="../content.js"></script>
<div id="RESULT">running…</div>
<script>
setTimeout(() => {
  const u = location.href;
  const picked = (u.match(/PERFORMANCE_PRICE_AREA_ID=(\d+)/) || [])[1];
  document.getElementById('RESULT').textContent =
    'HIDE_SOLDOUT_CHECKED=' + (document.getElementById('HIDE').checked ? 'PASS' : 'FAIL') +
    ' | SOLDOUT_ROWS_HIDDEN=' + (document.getElementById('1001').style.display === 'none' ? 'PASS' : 'FAIL') +
    ' | PICKED=' + (picked || 'none');
}, 2500);
</script>
</body></html>
