<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><title>列沒有 id 也要點得到；點了沒反應要自動繼續監</title></head><body>
<div id="AREA_DIV"><table id="salesTable">
  <tr class="status_tr"><td onclick="window.__result.rowClicks=(window.__result.rowClicks||0)+1">■</td><td>1樓C02區8380元</td><td>8,380</td><td id="L1">5</td></tr>
</table></div>
<div class="btn-update" onclick="window.__clicks=(window.__clicks||0)+1" style="width:120px;height:36px">更新票數</div>
<script>
 window.__result = {};
 const store = { enabled:true, watch:true, count:2, presaleCode:'' };
 window.chrome = { storage:{ sync:{ get:(d)=>Promise.resolve(Object.assign({},d,store)), set:()=>Promise.resolve() },
   local:{ get:(d)=>Promise.resolve(d), set:()=>Promise.resolve() }, onChanged:{ addListener(){} } },
   runtime:{ onMessage:{ addListener(){} }, sendMessage(){} } };
 window.fetch = () => Promise.reject(new Error('offline'));
</script>
<script src="../inject.js"></script><script src="../content.js"></script>
<div id="RESULT">running…</div>
<script>
// handler 綁在 td 上（不是 tr）；點了之後網站「沒有任何回應」→ 2.5 秒後要自動恢復監票
setTimeout(() => { window.__result.clicksAt2s = window.__clicks||0; }, 2000);
setTimeout(() => {
  const r = window.__result;
  document.getElementById('RESULT').textContent =
    'TD_HANDLER_HIT=' + ((r.rowClicks||0) >= 1 ? 'PASS' : 'FAIL') +
    ' | RESUMED_WITHOUT_ANY_MESSAGE=' + ((window.__clicks||0) > r.clicksAt2s ? 'PASS(' + window.__clicks + ')' : 'FAIL(' + (window.__clicks||0) + ')');
}, 6500);
</script>
</body></html>
