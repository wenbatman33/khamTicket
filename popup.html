<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  body { width: 300px; font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
         font-size: 14px; margin: 0; padding: 14px; background: #fafafa; color: #333; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 5px; }
  input[type="text"] { width: 100%; box-sizing: border-box; padding: 7px 8px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; }
  .field.inline { display: flex; align-items: center; gap: 10px; }
  .field.inline label { margin: 0; white-space: nowrap; }
  .field.inline input[type="number"] { width: 70px; text-align: center; padding: 7px 4px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .check input { width: 16px; height: 16px; margin: 0; }
  .check label { font-weight: 500; margin: 0; }
  .master { border-radius: 8px; padding: 10px 12px; margin-bottom: 14px;
    border: 2px solid #ccc; background: #f0f0f0; }
  .master.on { border-color: #c8102e; background: #fdecef; }
  .master-row { display: flex; align-items: center; gap: 10px; }
  .master-row input { width: 20px; height: 20px; margin: 0; flex: 0 0 auto; }
  .master-row label { font-size: 15px; font-weight: 700; margin: 0; }
  .master-state { font-size: 12px; color: #666; margin-top: 6px; line-height: 1.5; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 6px;
    font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }
  #save { background: #c8102e; color: #fff; }
  #run { background: #eee; color: #333; }
  #status { font-size: 12px; color: #2e7d32; min-height: 18px; text-align: center; }
</style>
</head>
<body>
  <h1>🎫 寬宏填寫輔助</h1>

  <div class="master" id="masterBox">
    <div class="master-row">
      <input type="checkbox" id="enabled">
      <label for="enabled">啟用</label>
    </div>
    <div class="master-state" id="masterState"></div>
  </div>

  <div class="field">
    <label for="presaleCode">優先購序號</label>
    <input type="text" id="presaleCode" placeholder="一般販售留空">
  </div>

  <div class="check">
    <input type="checkbox" id="autoSubmitPresale">
    <label for="autoSubmitPresale">填好就自動按「送出」</label>
  </div>

  <div class="field inline">
    <label for="count">每次填幾張</label>
    <input type="number" id="count" min="1" max="8">
  </div>

  <button id="save">💾 儲存</button>
  <button id="run">▶ 在目前分頁填一次</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
